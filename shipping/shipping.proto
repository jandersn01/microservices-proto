syntax = "proto3";

option go_package = "github/jandersn01/microservices-proto/golang/shipping";

message OrderItem {
    string product_code = 1;
    int32 quantity = 2;
}

message CreateShippingRequest {
    int64 order_id = 1;
    repeated OrderItem items = 2;
}

message CreateShippingResponse {
    int64 order_id = 1;
    int32 delivery_deadline_days = 2;
}

service Shipping {
    rpc CalculateDeadline (CreateShippingRequest) returns (CreateShippingResponse){}
}